name: release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - run: make check
      - run: ./scripts/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
